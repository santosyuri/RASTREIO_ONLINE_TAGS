<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Rastreio Online</title>
  
  <!-- Configurações do PWA -->
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">

  <style>
    /* Estilização minimalista de carregamento e fallback */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #ffffff;
    }
    .loader-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #ffcc00; /* Destaque em amarelo */
      animation: spin 1s ease-in-out infinite;
    }
    .text {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.5px;
      opacity: 0.8;
    }
    .btn-manual {
      display: none;
      margin-top: 15px;
      padding: 12px 24px;
      background-color: #ffcc00;
      color: #000000;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 204, 0, 0.2);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="loader-container">
    <div class="spinner" id="loader"></div>
    <div class="text" id="status-text">Conectando ao sistema de rastreamento...</div>
    <a href="http://www.brgps.com/#/login" class="btn-manual" id="btn-entrar">Entrar no Sistema</a>
  </div>

  <script>
    // URL final do sistema de rastreamento
    const TARGET_URL = "http://www.brgps.com/#/login";

    function iniciarRedirecionamento() {
      // Executa o redirecionamento imediato para o sistema alvo
      window.location.href = TARGET_URL;

      // Caso o navegador bloqueie ou demore (fallback de segurança)
      setTimeout(() => {
        const statusText = document.getElementById('status-text');
        const btnEntrar = document.getElementById('btn-entrar');
        const loader = document.getElementById('loader');

        if (loader) loader.style.display = 'none';
        if (statusText) statusText.innerText = "Se o redirecionamento não acontecer automaticamente, clique no botão abaixo:";
        if (btnEntrar) btnEntrar.style.display = 'inline-block';
      }, 2500);
    }

    // Inicializa assim que o DOM estiver pronto
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', iniciarRedirecionamento);
    } else {
      iniciarRedirecionamento();
    }

    // Registro do Service Worker para o PWA (Instalação no celular)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registrado com sucesso:', reg.scope))
          .catch(err => console.error('Falha ao registrar o Service Worker:', err));
      });
    }
  </script>
</body>
</html>
